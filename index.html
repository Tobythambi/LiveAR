<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AR Hand-Controlled Model</title>
<!-- MindAR's ES module build imports Three.js with bare specifiers
     ("three" and "three/addons/..."), which browsers only resolve via an import map. -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.136.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.136.0/examples/jsm/"
  }
}
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  /* MindAR injects its own <video> (camera feed) and <canvas> into #container.
     Force the video to fill the screen behind the canvas so the feed is visible. */
  #container video {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    z-index: 0 !important;
    display: block !important;
  }
  #container canvas {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 1 !important;
  }
  /* Our own overlay canvas for drawing the hand skeleton, above MindAR's canvas */
  #hand-overlay {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 5 !important;
    pointer-events: none;
  }
  #hand-hint {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: #fff;
    font-size: 13px;
    background: rgba(0,0,0,0.5);
    padding: 10px 16px;
    border-radius: 12px;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #hand-hint.hidden {
    opacity: 0;
  }
  #hand-hint svg {
    opacity: 0.9;
  }
  #status {
    position: absolute;
    top: env(safe-area-inset-top, 12px);
    left: 12px;
    right: 12px;
    z-index: 10;
    color: #fff;
    font-size: 13px;
    background: rgba(0,0,0,0.55);
    padding: 8px 12px;
    border-radius: 8px;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="container">
  <div id="status">Point your camera at the target image</div>
  <canvas id="hand-overlay"></canvas>
  <div id="hand-hint">
    <svg width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 33V15.5a2.6 2.6 0 0 1 5.2 0V26" fill="rgba(255,255,255,0.10)"/>
      <path d="M17.2 25V11.5a2.6 2.6 0 0 1 5.2 0V25" fill="rgba(255,255,255,0.10)"/>
      <path d="M22.4 25V10.5a2.6 2.6 0 0 1 5.2 0V25" fill="rgba(255,255,255,0.10)"/>
      <path d="M27.6 25V13a2.6 2.6 0 0 1 5.2 0v14" fill="rgba(255,255,255,0.10)"/>
      <path d="M12 26.5c0-2.4-1.6-4.2-3.6-4.2S5 23.7 5 25.6c0 1 .3 1.9.9 2.7l4.3 6" fill="rgba(255,255,255,0.10)"/>
      <path d="M10.2 34.3c1.9 5.2 6.6 8.7 12 8.7 7 0 10.6-4.6 10.6-11V27" fill="rgba(255,255,255,0.10)"/>
      <path d="M36 14.5a10 10 0 0 1 5.6 5.4" opacity="0.75"/>
      <path d="M41.8 15.2l.2 5-5-.6" opacity="0.75"/>
    </svg>
    <span>Hold your hand up to rotate the model</span>
  </div>
</div>

<script>
  // Surface any JS error directly on screen, since there's no console on a phone.
  // capture:true so this also catches <script src> resources that fail to load (404s etc).
  window.addEventListener('error', (e) => {
    const el = document.getElementById('status');
    if (!el) return;
    el.style.background = 'rgba(180,0,0,0.85)';
    if (e.target && (e.target.tagName === 'SCRIPT')) {
      el.textContent = 'Failed to load script: ' + e.target.src;
    } else {
      el.textContent = 'Error: ' + (e.message || 'unknown') +
        (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
    }
  }, true);
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('status');
    if (el) {
      el.style.background = 'rgba(180,0,0,0.85)';
      el.textContent = 'Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });
  window.__checkpoint = (msg) => {
    const el = document.getElementById('status');
    if (el && !el.textContent.startsWith('Error') && !el.textContent.startsWith('Failed')) {
      el.textContent = msg;
    }
  };
  window.__checkpoint('Loading MindAR...');
</script>

<!-- MediaPipe Hand Landmarker (hand tracking) + MindAR loaded via fetch/eval below -->

<!-- MediaPipe Hand Landmarker (hand tracking) -->
<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const statusEl = document.getElementById('status');

// ---- CONFIG ----
// Replace with your compiled .mind target file and your 3D model.
const TARGET_SRC = './assets/target.mind';
const MODEL_SRC = './assets/model.stl';

let MindARThree;

try {
  statusEl.textContent = 'Importing MindAR module...';
  const mod = await import(/* @vite-ignore */ 'https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-three.prod.js');
  MindARThree = mod.MindARThree || (mod.default && mod.default.MindARThree);
  if (!MindARThree) {
    throw new Error('No MindARThree export found. Keys: ' + Object.keys(mod).join(', '));
  }
} catch (err) {
  statusEl.style.background = 'rgba(180,0,0,0.85)';
  statusEl.textContent = 'MindAR load failed: ' + (err && err.message ? err.message : err);
  throw err;
}

const mindarThree = new MindARThree({
  container: document.querySelector("#container"),
  imageTargetSrc: TARGET_SRC,
});

const { renderer, scene, camera } = mindarThree;

const light1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(light1);
const light2 = new THREE.DirectionalLight(0xffffff, 0.8);
light2.position.set(1, 2, 2);
scene.add(light2);

// Anchor tied to the recognized target
const anchor = mindarThree.addAnchor(0);

// Group we actually rotate with hand input, nested inside the anchor
const modelGroup = new THREE.Group();
anchor.group.add(modelGroup);

let targetFound = false;
anchor.onTargetFound = () => {
  targetFound = true;
  statusEl.textContent = "Model locked — move your hand to rotate it";
};
anchor.onTargetLost = () => {
  targetFound = false;
  statusEl.textContent = "Point your camera at the target image";
};

// Model loading happens inside the async startup below.
function loadModel() {
  const loader = new STLLoader();
  loader.load(
    MODEL_SRC,
    (geometry) => {
      // STL has no built-in color/texture — pick a flat material color here.
      // (change 0x9fe1cb to whatever suits your object)
      const material = new THREE.MeshStandardMaterial({
        color: 0x9fe1cb,
        metalness: 0.1,
        roughness: 0.6,
      });

      if (!geometry.attributes.normal) {
        geometry.computeVertexNormals();
      }
      geometry.center(); // centers the mesh at the origin

      const model = new THREE.Mesh(geometry, material);

      // Normalize scale so any model size looks reasonable on the target
      geometry.computeBoundingBox();
      const size = new THREE.Vector3();
      geometry.boundingBox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 0.5 / maxDim;
      model.scale.setScalar(scale);
      model.rotation.x = -Math.PI / 2; // STL is often Z-up; lay flat on the marker, adjust to taste

      modelGroup.add(model);
    },
    undefined,
    (err) => {
      console.error('Model failed to load', err);
      statusEl.textContent = "Couldn't load the 3D model — check assets/model.stl";
    }
  );
}

// ---------------------------------------------------------------------
// Hand tracking: reuse MindAR's own camera <video> element for MediaPipe,
// so we never call getUserMedia a second time.
// ---------------------------------------------------------------------
let handLandmarker = null;
let lastVideoTime = -1;

let targetRotY = 0;
let targetRotX = 0;
let curRotY = 0;
let curRotX = 0;

async function initHandTracking() {
  const fileset = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    },
    runningMode: "VIDEO",
    numHands: 1,
  });
}

function findMindARVideo() {
  // MindAR injects its own <video> into the container as the camera feed
  return document.querySelector('#container video');
}

// ---------------------------------------------------------------------
// Hand skeleton overlay
// ---------------------------------------------------------------------
const overlayCanvas = document.getElementById('hand-overlay');
const overlayCtx = overlayCanvas.getContext('2d');
const handHint = document.getElementById('hand-hint');

function resizeOverlay() {
  const rect = overlayCanvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  if (overlayCanvas.width !== rect.width * dpr || overlayCanvas.height !== rect.height * dpr) {
    overlayCanvas.width = rect.width * dpr;
    overlayCanvas.height = rect.height * dpr;
  }
}

function drawHand(landmarks) {
  resizeOverlay();
  const w = overlayCanvas.width;
  const h = overlayCanvas.height;
  overlayCtx.clearRect(0, 0, w, h);

  if (!landmarks) return;

  const px = (i) => landmarks[i].x * w;
  const py = (i) => landmarks[i].y * h;
  const unit = Math.min(w, h);

  overlayCtx.lineCap = 'round';
  overlayCtx.lineJoin = 'round';

  // Filled palm so the overlay reads as a hand, not a wireframe
  const palm = [0, 1, 5, 9, 13, 17];
  overlayCtx.beginPath();
  overlayCtx.moveTo(px(palm[0]), py(palm[0]));
  for (let i = 1; i < palm.length; i++) {
    overlayCtx.lineTo(px(palm[i]), py(palm[i]));
  }
  overlayCtx.closePath();
  overlayCtx.fillStyle = 'rgba(159, 225, 203, 0.28)';
  overlayCtx.fill();
  overlayCtx.strokeStyle = 'rgba(159, 225, 203, 0.9)';
  overlayCtx.lineWidth = unit * 0.012;
  overlayCtx.stroke();

  // Fingers as thick strokes that taper toward the tips
  const fingers = [
    [1, 2, 3, 4],      // thumb
    [5, 6, 7, 8],      // index
    [9, 10, 11, 12],   // middle
    [13, 14, 15, 16],  // ring
    [17, 18, 19, 20],  // pinky
  ];
  overlayCtx.strokeStyle = 'rgba(159, 225, 203, 0.92)';
  for (const finger of fingers) {
    for (let i = 0; i < finger.length - 1; i++) {
      // Segments get thinner the closer they are to the fingertip
      const taper = 1 - (i / (finger.length - 1)) * 0.45;
      overlayCtx.lineWidth = unit * 0.026 * taper;
      overlayCtx.beginPath();
      overlayCtx.moveTo(px(finger[i]), py(finger[i]));
      overlayCtx.lineTo(px(finger[i + 1]), py(finger[i + 1]));
      overlayCtx.stroke();
    }
  }

  // Fingertips highlighted, other joints smaller
  const tips = [4, 8, 12, 16, 20];
  for (let i = 0; i < landmarks.length; i++) {
    const isTip = tips.includes(i);
    overlayCtx.beginPath();
    overlayCtx.arc(px(i), py(i), unit * (isTip ? 0.013 : 0.008), 0, Math.PI * 2);
    overlayCtx.fillStyle = isTip ? '#ffffff' : 'rgba(255,255,255,0.75)';
    overlayCtx.fill();
  }
}

function trackHands() {
  const video = findMindARVideo();
  if (video && handLandmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = handLandmarker.detectForVideo(video, performance.now());
    if (result.landmarks && result.landmarks.length > 0) {
      const landmarks = result.landmarks[0];
      const wrist = landmarks[0]; // 0 = wrist landmark
      // Map horizontal hand position to Y rotation, vertical to X rotation
      targetRotY = (0.5 - wrist.x) * 6;
      targetRotX = (wrist.y - 0.5) * 3;

      drawHand(landmarks);
      handHint.classList.add('hidden');
    } else {
      drawHand(null);
      handHint.classList.remove('hidden');
    }
  }
  requestAnimationFrame(trackHands);
}

// ---------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------

function animate() {
  renderer.setAnimationLoop(() => {
    if (targetFound) {
      curRotY += (targetRotY - curRotY) * 0.12;
      curRotX += (targetRotX - curRotX) * 0.12;
      modelGroup.rotation.y = curRotY;
      modelGroup.rotation.x = curRotX;
    }
    renderer.render(scene, camera);
  });
}

(async () => {
  try {
    loadModel();

    statusEl.textContent = "Starting camera...";
    await mindarThree.start();
    animate();
    statusEl.textContent = "Point your camera at the target image";
    await initHandTracking();
    trackHands();
  } catch (err) {
    console.error(err);
    statusEl.style.background = 'rgba(180,0,0,0.85)';
    statusEl.textContent = "Startup error: " + (err && err.message ? err.message : err);
  }
})();
</script>
</body>
</html>
