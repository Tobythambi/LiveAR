<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AR Model Viewer</title>
<!-- MindAR's ES module build imports Three.js with bare specifiers
     ("three" and "three/addons/..."), which browsers only resolve via an import map. -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.136.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.136.0/examples/jsm/"
  }
}
</script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  /* MindAR injects its own <video> (camera feed) and <canvas> into #container.
     Force the video to fill the screen behind the canvas so the feed is visible. */
  #container video {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    z-index: 0 !important;
    display: block !important;
  }
  #container canvas {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    z-index: 1 !important;
  }
  #status {
    position: absolute;
    top: env(safe-area-inset-top, 12px);
    left: 12px;
    right: 12px;
    z-index: 10;
    color: #fff;
    font-size: 13px;
    background: rgba(0,0,0,0.55);
    padding: 8px 12px;
    border-radius: 8px;
    text-align: center;
    pointer-events: none;
  }
  /* Drag anywhere on this circle to rotate the model */
  #grab-zone {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    width: 104px;
    height: 104px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    text-align: center;
    font-size: 12px;
    line-height: 1.2;
    color: #fff;
    background: rgba(226, 75, 74, 0.4);
    border: 3px solid #E24B4A;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    transition: opacity 0.3s ease, background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  #grab-zone.visible {
    opacity: 1;
  }
  #grab-zone.grabbed {
    background: rgba(29, 158, 117, 0.45);
    border-color: #1D9E75;
    transform: translateX(-50%) scale(1.1);
  }
  #grab-zone svg {
    opacity: 0.9;
  }
  #reset-btn {
    position: absolute;
    bottom: 62px;
    right: 24px;
    z-index: 7;
    padding: 9px 14px;
    font-size: 12px;
    color: #fff;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #reset-btn.visible {
    opacity: 1;
  }
</style>
</head>
<body>

<div id="container">
  <div id="status">Point your camera at the target image</div>
  <div id="grab-zone">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/>
      <path d="M20.6 4.5v5h-5"/>
    </svg>
    <span id="grab-label">Drag</span>
  </div>
  <button id="reset-btn" type="button">Reset</button>
</div>

<script>
  // Surface any JS error directly on screen, since there's no console on a phone.
  window.addEventListener('error', (e) => {
    const el = document.getElementById('status');
    if (!el) return;
    el.style.background = 'rgba(180,0,0,0.85)';
    if (e.target && (e.target.tagName === 'SCRIPT')) {
      el.textContent = 'Failed to load script: ' + e.target.src;
    } else {
      el.textContent = 'Error: ' + (e.message || 'unknown') +
        (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
    }
  }, true);
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('status');
    if (el) {
      el.style.background = 'rgba(180,0,0,0.85)';
      el.textContent = 'Error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }
  });
</script>

<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

const statusEl = document.getElementById('status');
const grabZone = document.getElementById('grab-zone');
const grabLabel = document.getElementById('grab-label');
const resetBtn = document.getElementById('reset-btn');

// ---- CONFIG ----
const TARGET_SRC = './assets/target.mind';
const MODEL_SRC = './assets/model.stl';

let MindARThree;

try {
  statusEl.textContent = 'Loading AR engine...';
  const mod = await import('https://unpkg.com/mind-ar@1.2.5/dist/mindar-image-three.prod.js');
  MindARThree = mod.MindARThree || (mod.default && mod.default.MindARThree);
  if (!MindARThree) {
    throw new Error('No MindARThree export found. Keys: ' + Object.keys(mod).join(', '));
  }
} catch (err) {
  statusEl.style.background = 'rgba(180,0,0,0.85)';
  statusEl.textContent = 'AR engine failed to load: ' + (err && err.message ? err.message : err);
  throw err;
}

const mindarThree = new MindARThree({
  container: document.querySelector("#container"),
  imageTargetSrc: TARGET_SRC,
});

const { renderer, scene, camera } = mindarThree;

const light1 = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
scene.add(light1);
const light2 = new THREE.DirectionalLight(0xffffff, 0.8);
light2.position.set(1, 2, 2);
scene.add(light2);

const anchor = mindarThree.addAnchor(0);

const modelGroup = new THREE.Group();
anchor.group.add(modelGroup);

// ---------------------------------------------------------------------
// Rotation state — driven by dragging the circle button
// ---------------------------------------------------------------------
let targetRotY = 0;
let targetRotX = 0;
let curRotY = 0;
let curRotX = 0;

let targetFound = false;

let isDragging = false;
let dragPointerId = null;
let dragStartX = 0;
let dragStartY = 0;
let dragBaseRotY = 0;
let dragBaseRotX = 0;

// A drag across the full screen width turns the model a bit more than one full circle
const ROTATE_SENSITIVITY = (Math.PI * 2.2) / (window.innerWidth || 400);

grabZone.addEventListener('pointerdown', (e) => {
  if (!targetFound) return;
  e.preventDefault();
  isDragging = true;
  dragPointerId = e.pointerId;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragBaseRotY = targetRotY;
  dragBaseRotX = targetRotX;
  grabZone.setPointerCapture(e.pointerId);
  grabZone.classList.add('grabbed');
  grabLabel.textContent = 'Rotating';
  statusEl.textContent = "Drag left or right to spin the model";
});

grabZone.addEventListener('pointermove', (e) => {
  if (!isDragging || e.pointerId !== dragPointerId) return;
  e.preventDefault();
  targetRotY = dragBaseRotY + (e.clientX - dragStartX) * ROTATE_SENSITIVITY;
  targetRotX = dragBaseRotX + (e.clientY - dragStartY) * ROTATE_SENSITIVITY * 0.6;
});

function endDrag(e) {
  if (!isDragging) return;
  if (e && e.pointerId !== dragPointerId) return;
  isDragging = false;
  dragPointerId = null;
  grabZone.classList.remove('grabbed');
  grabLabel.textContent = 'Drag';
  if (targetFound) {
    statusEl.textContent = "Drag the circle to rotate the model";
  }
}

grabZone.addEventListener('pointerup', endDrag);
grabZone.addEventListener('pointercancel', endDrag);

resetBtn.addEventListener('click', () => {
  targetRotY = 0;
  targetRotX = 0;
});

anchor.onTargetFound = () => {
  targetFound = true;
  grabZone.classList.add('visible');
  resetBtn.classList.add('visible');
  statusEl.textContent = "Drag the circle to rotate the model";
};
anchor.onTargetLost = () => {
  targetFound = false;
  endDrag();
  grabZone.classList.remove('visible');
  resetBtn.classList.remove('visible');
  statusEl.textContent = "Point your camera at the target image";
};

// ---------------------------------------------------------------------
// Model
// ---------------------------------------------------------------------
function loadModel() {
  const loader = new STLLoader();
  loader.load(
    MODEL_SRC,
    (geometry) => {
      // STL carries geometry only — set the colour here
      const material = new THREE.MeshStandardMaterial({
        color: 0x9fe1cb,
        metalness: 0.1,
        roughness: 0.6,
      });

      if (!geometry.attributes.normal) {
        geometry.computeVertexNormals();
      }
      geometry.center();

      const model = new THREE.Mesh(geometry, material);

      geometry.computeBoundingBox();
      const size = new THREE.Vector3();
      geometry.boundingBox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const scale = 0.5 / maxDim;
      model.scale.setScalar(scale);
      model.rotation.x = -Math.PI / 2; // STL is often Z-up; adjust if it looks wrong

      modelGroup.add(model);
    },
    undefined,
    (err) => {
      console.error('Model failed to load', err);
      statusEl.textContent = "Couldn't load the 3D model — check assets/model.stl";
    }
  );
}

// ---------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------
function animate() {
  renderer.setAnimationLoop(() => {
    // Ease toward the target rotation so dragging feels smooth
    curRotY += (targetRotY - curRotY) * 0.15;
    curRotX += (targetRotX - curRotX) * 0.15;
    modelGroup.rotation.y = curRotY;
    modelGroup.rotation.x = curRotX;
    renderer.render(scene, camera);
  });
}

(async () => {
  try {
    loadModel();
    statusEl.textContent = "Starting camera...";
    await mindarThree.start();
    animate();
    statusEl.textContent = "Point your camera at the target image";
  } catch (err) {
    console.error(err);
    statusEl.style.background = 'rgba(180,0,0,0.85)';
    statusEl.textContent = "Startup error: " + (err && err.message ? err.message : err);
  }
})();
</script>
</body>
</html>
